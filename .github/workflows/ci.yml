name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Optional AI advisor — never inline keys; tolerate missing secrets.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Gate jobs tolerate missing secrets: deferred client init + 503 without key.
        # If NEXT_PUBLIC_* is added later, wire via ${{ secrets.* }} only — never literals.
